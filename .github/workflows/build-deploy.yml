name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  MAJOR_VERSION: "1.0"
  VERSION_NUM: "1.0.${{ github.run_number }}"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B verify

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set project version
        run: mvn -B versions:set -DnewVersion=${VERSION_NUM} -DgenerateBackupPoms=false

      - uses: docker/setup-buildx-action@v4

      - name: Resolve registry host
        id: registry
        run: echo "host=${IMAGE_NAME%%/*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.MAJOR_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION_NUM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy container
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_SERVER: ${{ vars.SSH_SERVER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_SERVER" "
            docker pull $IMAGE_NAME:$VERSION_NUM &&
            (docker stop audio-downloader-bot || true) &&
            (docker rm audio-downloader-bot || true) &&
            docker run -d --name audio-downloader-bot --restart unless-stopped -p 16005:8080 \
              -e TELEGRAM_BOT_USERNAME='$TELEGRAM_BOT_USERNAME' \
              -e TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN' \
              $IMAGE_NAME:$VERSION_NUM
          "

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
